active_profile: normal

# Parallelität: wie viele Threads gleichzeitig je eine eigene Gruppe scrapen.
# max_workers: 1 = sequentiell (bisheriges Verhalten), 2–4 = parallel.
# worker_profiles: Profil je Thread-Slot (Index 0, 1, 2, 3).
# Erster Test: max_workers=2; auf 4 hochsetzen sobald stabil.
concurrency:
  max_workers: 2
  worker_profiles:
    - semi_aggressive
    - normal
    - semi_aggressive
    - semi_aggressive

# Fuzzy-Profilauswahl: Gewichtung für zufällige Profilwahl pro Gruppe
# Worker wählt bei jedem Gruppen-Start zufällig (gewichtet) — kein erkennbares Muster
# aggressive + conservative: Gewicht 0 — nur zur Referenz, nicht mehr im Einsatz
fuzzy_weights:
  aggressive:        0
  semi_aggressive:  60
  normal:           40
  semi_conservative:  0
  conservative:      0
profiles:
  # --- Referenz-Profile (nicht mehr im Einsatz) ---
  aggressive:
    base_wait_seconds: 1.0
    min_wait_seconds: 0.7
    jitter: 0.30
    timeout_seconds: 10
    max_retries: 2
    cooldown_on_429: 30
    use_proxy: false
  conservative:
    base_wait_seconds: 8.0
    min_wait_seconds: 4.0
    jitter: 0.50
    timeout_seconds: 30
    max_retries: 5
    cooldown_on_429: 120
    use_proxy: true
  # --- Aktive Profile ---
  semi_aggressive:
    base_wait_seconds: 2.0
    min_wait_seconds: 1.1
    jitter: 0.35
    timeout_seconds: 15
    max_retries: 2
    cooldown_on_429: 45
    use_proxy: true
  normal:
    base_wait_seconds: 3.0
    min_wait_seconds: 1.5
    jitter: 0.40
    timeout_seconds: 20
    max_retries: 3
    cooldown_on_429: 60
    use_proxy: true
  semi_conservative:
    base_wait_seconds: 5.5
    min_wait_seconds: 2.7
    jitter: 0.45
    timeout_seconds: 25
    max_retries: 4
    cooldown_on_429: 90
    use_proxy: true
