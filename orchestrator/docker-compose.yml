## Erster Start auf dem VPS
## ─────────────────────────────────────────────────────────────────────────────
## Die Queue (scrape_groups/scrape_runs) liegt seit Review #5 im Schema
## "orchestrator" der fidedb (PostgreSQL) — Migration migrations/013,
## setup_db.py provisioniert das Schema auch selbst (idempotent).
##
##   # 1. Image bauen
##   docker compose build
##
##   # 2. Gruppen generieren (braucht data/players_list_foa_2026-04.txt im Projektverzeichnis)
##   docker compose run --rm worker \
##     python orchestrator/generate_groups.py \
##     --txt data/players_list_foa_2026-04.txt
##
##   # 3. Netzwerkname prüfen und ggf. DOCKER_NETWORK in .env anpassen
##   docker network ls | grep fide
##
##   # 4. Services starten
##   docker compose up -d
## ─────────────────────────────────────────────────────────────────────────────

services:

  dashboard:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    # profiles.yaml ist seit Review #4 rein statisch (Git/Image = Wahrheit);
    # Laufzeit-State (enabled/active_hours/max_hours/active_profile) liegt in
    # /data/runtime_settings.json. Das frühere cp-n-Seeding nach /data entfällt.
    command: python -m orchestrator.app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://fide:${DB_PASSWORD}@host.docker.internal:5432/fidedb
      ORCHESTRATOR_DATA_DIR: /data
      ORCHESTRATOR_PROFILES: /app/orchestrator/profiles.yaml
      # DataImpulse Residential Rotating: ein Gateway für alle Threads
      # (orchestrator/dataimpulse_gateway.txt), Country-Targeting pro Thread
      # über den Login-Namen (LOGIN__cr.de) — daher ein Username pro Land
      # + ein gemeinsames Passwort (siehe .env.example).
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      PROXY_POOL_FILE: ${PROXY_POOL_FILE:-orchestrator/dataimpulse_gateway.txt}
      PROXY_DI_PASSWORD: ${PROXY_DI_PASSWORD:-}
      PROXY_DI_USERNAME_DE: ${PROXY_DI_USERNAME_DE:-}
      PROXY_DI_USERNAME_IN: ${PROXY_DI_USERNAME_IN:-}
      PROXY_DI_USERNAME_GB: ${PROXY_DI_USERNAME_GB:-}
      PROXY_DI_USERNAME_US: ${PROXY_DI_USERNAME_US:-}
      PROXY_DI_USERNAME_HK: ${PROXY_DI_USERNAME_HK:-}
      PROXY_DI_USERNAME_ES: ${PROXY_DI_USERNAME_ES:-}
      PROXY_DI_USERNAME_MX: ${PROXY_DI_USERNAME_MX:-}
      PROXY_DI_USERNAME_AE: ${PROXY_DI_USERNAME_AE:-}
      PROXY_DI_USERNAME_CH: ${PROXY_DI_USERNAME_CH:-}
    volumes:
      - orchestrator_data:/data
      - ../config.yaml:/app/config.yaml:ro
      - ../orchestrator/dataimpulse_gateway.txt:/app/orchestrator/dataimpulse_gateway.txt:ro
    ports:
      - "127.0.0.1:8050:8050"
    networks:
      - fide_net
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`scelo.chesspit.net`)"
      - "traefik.http.routers.orchestrator.entrypoints=https"
      - "traefik.http.routers.orchestrator.tls=true"
      - "traefik.http.routers.orchestrator.tls.certresolver=letsencrypt"
      - "traefik.http.routers.orchestrator.middlewares=orchestrator-auth"
      - "traefik.http.middlewares.orchestrator-auth.basicauth.users=peter:$$2a$$14$$AxmEncpsINswxyIJneTobunbJmseSDGwHJsi27DProe4P9e7TPfOy"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8050"
      - "traefik.docker.network=coolify"
    restart: unless-stopped

  worker:

    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    # profiles.yaml statisch aus dem Image (siehe Dashboard-Kommentar oben);
    # Laufzeit-State teilt sich der Worker mit dem Dashboard über
    # /data/runtime_settings.json (gemeinsames Volume).
    command: python -m orchestrator.worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://fide:${DB_PASSWORD}@host.docker.internal:5432/fidedb
      ORCHESTRATOR_DATA_DIR: /data
      ORCHESTRATOR_PROFILES: /app/orchestrator/profiles.yaml
      # DataImpulse Residential Rotating: ein Gateway für alle Threads
      # (orchestrator/dataimpulse_gateway.txt), Country-Targeting pro Thread
      # über den Login-Namen (LOGIN__cr.de) — daher ein Username pro Land
      # + ein gemeinsames Passwort (siehe .env.example).
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      PROXY_POOL_FILE: ${PROXY_POOL_FILE:-orchestrator/dataimpulse_gateway.txt}
      PROXY_DI_PASSWORD: ${PROXY_DI_PASSWORD:-}
      PROXY_DI_USERNAME_DE: ${PROXY_DI_USERNAME_DE:-}
      PROXY_DI_USERNAME_IN: ${PROXY_DI_USERNAME_IN:-}
      PROXY_DI_USERNAME_GB: ${PROXY_DI_USERNAME_GB:-}
      PROXY_DI_USERNAME_US: ${PROXY_DI_USERNAME_US:-}
      PROXY_DI_USERNAME_HK: ${PROXY_DI_USERNAME_HK:-}
      PROXY_DI_USERNAME_ES: ${PROXY_DI_USERNAME_ES:-}
      PROXY_DI_USERNAME_MX: ${PROXY_DI_USERNAME_MX:-}
      PROXY_DI_USERNAME_AE: ${PROXY_DI_USERNAME_AE:-}
      PROXY_DI_USERNAME_CH: ${PROXY_DI_USERNAME_CH:-}
      # VPS-IP ist von FIDE geblockt: nach 429/Cooldown nie direkt (ohne Proxy)
      # fetchen, sondern erneut über den Pool (siehe worker.py::_direct_fallback_on_429)
      DIRECT_FALLBACK_ON_429: "false"
      WORKER_DEVICE: ${WORKER_DEVICE:-}
      # Stabile claimed_by-Identität für die geteilte PG-Queue (Phase B):
      # Container-Hostnamen wechseln bei jedem Recreate, damit fände
      # reset_stale_running() die eigenen unterbrochenen Gruppen nicht mehr.
      WORKER_DEVICE_ID: ${WORKER_DEVICE_ID:-vps}
    volumes:
      - orchestrator_data:/data
      - ../config.yaml:/app/config.yaml:ro
      - ../data:/app/data:ro
      - ../orchestrator/dataimpulse_gateway.txt:/app/orchestrator/dataimpulse_gateway.txt:ro
    networks:
      - fide_net
    # unless-stopped — Worker immer neu starten (auch nach Crash), ausser bei explizitem
    # 'docker compose stop'. Worker selbst exitiert nicht mehr bei "stopped"-Command,
    # sondern wartet im Poll-Loop auf den Start-Befehl vom Dashboard.
    restart: unless-stopped

volumes:
  orchestrator_data:

networks:
  fide_net:
    external: true
    name: ${DOCKER_NETWORK:-fide-scraper_default}
  coolify:
    external: true
    name: coolify
