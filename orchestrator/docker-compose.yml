## Erster Start auf dem VPS
## ─────────────────────────────────────────────────────────────────────────────
## scraper.db ist NICHT im Git (runtime-State, ändert sich mit jedem Scraping-Lauf).
## Vor dem ersten 'docker compose up' das Volume initialisieren:
##
##   # 1. Image bauen
##   docker compose build
##
##   # 2. Gruppen generieren (braucht data/players_list_foa_2026-04.txt im Projektverzeichnis)
##   docker compose run --rm worker \
##     python orchestrator/generate_groups.py \
##     --db /data/scraper.db \
##     --txt data/players_list_foa_2026-04.txt
##
##   # 3. Netzwerkname prüfen und ggf. DOCKER_NETWORK in .env anpassen
##   docker network ls | grep fide
##
##   # 4. Services starten
##   docker compose up -d
## ─────────────────────────────────────────────────────────────────────────────

services:

  dashboard:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    # profiles.yaml liegt im gemeinsamen Volume (/data), die git-Version dient nur als
    # Seed (cp -n = nur kopieren falls noch nicht vorhanden, Runtime-Config bleibt erhalten).
    command: sh -c "cp -n /app/orchestrator/profiles.yaml /data/profiles.yaml 2>/dev/null || true; exec python -m orchestrator.app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://fide:${DB_PASSWORD}@host.docker.internal:5432/fidedb
      ORCHESTRATOR_DATA_DIR: /data
      ORCHESTRATOR_PROFILES: /data/profiles.yaml
      # Webshare: ein gemeinsames Credential-Paar für den ganzen 100-IP-Pool
      # (siehe orchestrator/webshare_proxies.txt) — ersetzt die 9 separaten
      # ProxyJet-DC-Thread-Credential-Paare, die es bei Webshare nicht braucht.
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      PROXY_POOL_FILE: ${PROXY_POOL_FILE:-orchestrator/webshare_proxies.txt}
      PROXY_DC_USERNAME: ${PROXY_DC_USERNAME:-}
      PROXY_DC_PASSWORD: ${PROXY_DC_PASSWORD:-}
    volumes:
      - orchestrator_data:/data
      - ../config.yaml:/app/config.yaml:ro
      - ../orchestrator/webshare_proxies.txt:/app/orchestrator/webshare_proxies.txt:ro
      - ../orchestrator/webshare_proxies_americas.txt:/app/orchestrator/webshare_proxies_americas.txt:ro
      - ../orchestrator/webshare_proxies_europe.txt:/app/orchestrator/webshare_proxies_europe.txt:ro
      - ../orchestrator/webshare_proxies_mena_asia.txt:/app/orchestrator/webshare_proxies_mena_asia.txt:ro
    ports:
      - "127.0.0.1:8050:8050"
    networks:
      - fide_net
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`scelo.chesspit.net`)"
      - "traefik.http.routers.orchestrator.entrypoints=https"
      - "traefik.http.routers.orchestrator.tls=true"
      - "traefik.http.routers.orchestrator.tls.certresolver=letsencrypt"
      - "traefik.http.routers.orchestrator.middlewares=orchestrator-auth"
      - "traefik.http.middlewares.orchestrator-auth.basicauth.users=peter:$$2a$$14$$AxmEncpsINswxyIJneTobunbJmseSDGwHJsi27DProe4P9e7TPfOy"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8050"
      - "traefik.docker.network=coolify"
    restart: unless-stopped

  worker:

    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    # Seed wie beim Dashboard; profiles.yaml wird aus dem gemeinsamen Volume gelesen.
    command: sh -c "cp -n /app/orchestrator/profiles.yaml /data/profiles.yaml 2>/dev/null || true; exec python -m orchestrator.worker"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://fide:${DB_PASSWORD}@host.docker.internal:5432/fidedb
      ORCHESTRATOR_DATA_DIR: /data
      ORCHESTRATOR_PROFILES: /data/profiles.yaml
      # Webshare: ein gemeinsames Credential-Paar für den ganzen 100-IP-Pool
      # (siehe orchestrator/webshare_proxies.txt) — ersetzt die 9 separaten
      # ProxyJet-DC-Thread-Credential-Paare, die es bei Webshare nicht braucht.
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      PROXY_POOL_FILE: ${PROXY_POOL_FILE:-orchestrator/webshare_proxies.txt}
      PROXY_DC_USERNAME: ${PROXY_DC_USERNAME:-}
      PROXY_DC_PASSWORD: ${PROXY_DC_PASSWORD:-}
      WORKER_DEVICE: ${WORKER_DEVICE:-}
    volumes:
      - orchestrator_data:/data
      - ../config.yaml:/app/config.yaml:ro
      - ../data:/app/data:ro
      - ../orchestrator/webshare_proxies.txt:/app/orchestrator/webshare_proxies.txt:ro
      - ../orchestrator/webshare_proxies_americas.txt:/app/orchestrator/webshare_proxies_americas.txt:ro
      - ../orchestrator/webshare_proxies_europe.txt:/app/orchestrator/webshare_proxies_europe.txt:ro
      - ../orchestrator/webshare_proxies_mena_asia.txt:/app/orchestrator/webshare_proxies_mena_asia.txt:ro
    networks:
      - fide_net
    # unless-stopped — Worker immer neu starten (auch nach Crash), ausser bei explizitem
    # 'docker compose stop'. Worker selbst exitiert nicht mehr bei "stopped"-Command,
    # sondern wartet im Poll-Loop auf den Start-Befehl vom Dashboard.
    restart: unless-stopped

volumes:
  orchestrator_data:

networks:
  fide_net:
    external: true
    name: ${DOCKER_NETWORK:-fide-scraper_default}
  coolify:
    external: true
    name: coolify
