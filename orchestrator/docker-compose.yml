## Erster Start auf dem VPS
## ─────────────────────────────────────────────────────────────────────────────
## scraper.db ist NICHT im Git (runtime-State, ändert sich mit jedem Scraping-Lauf).
## Vor dem ersten 'docker compose up' das Volume initialisieren:
##
##   # 1. Image bauen
##   docker compose build
##
##   # 2. Gruppen generieren (braucht data/players_list_foa_2026-04.txt im Projektverzeichnis)
##   docker compose run --rm worker \
##     python orchestrator/generate_groups.py \
##     --db /data/scraper.db \
##     --txt data/players_list_foa_2026-04.txt
##
##   # 3. Netzwerkname prüfen und ggf. DOCKER_NETWORK in .env anpassen
##   docker network ls | grep fide
##
##   # 4. Services starten
##   docker compose up -d
## ─────────────────────────────────────────────────────────────────────────────

services:

  dashboard:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    command: python -m orchestrator.app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://fide:${DB_PASSWORD}@host.docker.internal:5432/fidedb
      ORCHESTRATOR_DATA_DIR: /data
      PROXYJET_USERNAME: ${PROXYJET_USERNAME}
      PROXYJET_PASSWORD: ${PROXYJET_PASSWORD}
      PROXYJET_HOST: ${PROXYJET_HOST:-proxy-jet.io}
      PROXYJET_PORT: ${PROXYJET_PORT:-1010}
      PROXYJET_DC_USERNAME: ${PROXYJET_DC_USERNAME:-}
      PROXYJET_DC_IN_USERNAME:  ${PROXYJET_DC_IN_USERNAME:-}
      PROXYJET_DC_IN_PASSWORD:  ${PROXYJET_DC_IN_PASSWORD:-}
      PROXYJET_DC_UK_USERNAME:  ${PROXYJET_DC_UK_USERNAME:-}
      PROXYJET_DC_UK_PASSWORD:  ${PROXYJET_DC_UK_PASSWORD:-}
      PROXYJET_DC_US_USERNAME:  ${PROXYJET_DC_US_USERNAME:-}
      PROXYJET_DC_US_PASSWORD:  ${PROXYJET_DC_US_PASSWORD:-}
      PROXYJET_DC_HK_USERNAME:  ${PROXYJET_DC_HK_USERNAME:-}
      PROXYJET_DC_HK_PASSWORD:  ${PROXYJET_DC_HK_PASSWORD:-}
      PROXYJET_DC_ES_USERNAME:  ${PROXYJET_DC_ES_USERNAME:-}
      PROXYJET_DC_ES_PASSWORD:  ${PROXYJET_DC_ES_PASSWORD:-}
      PROXYJET_DC_MX_USERNAME:  ${PROXYJET_DC_MX_USERNAME:-}
      PROXYJET_DC_MX_PASSWORD:  ${PROXYJET_DC_MX_PASSWORD:-}
      PROXYJET_DC_AE_USERNAME:  ${PROXYJET_DC_AE_USERNAME:-}
      PROXYJET_DC_AE_PASSWORD:  ${PROXYJET_DC_AE_PASSWORD:-}
      PROXYJET_DC_DACH_USERNAME: ${PROXYJET_DC_DACH_USERNAME:-}
      PROXYJET_DC_DACH_PASSWORD: ${PROXYJET_DC_DACH_PASSWORD:-}
      PROXYJET_DC_UPDATE_USERNAME: ${PROXYJET_DC_UPDATE_USERNAME:-}
      PROXYJET_DC_UPDATE_PASSWORD: ${PROXYJET_DC_UPDATE_PASSWORD:-}
    volumes:
      - orchestrator_data:/data
      - ../config.yaml:/app/config.yaml:ro
      - ./profiles.yaml:/app/orchestrator/profiles.yaml  # schreibbar: Dashboard persistiert Profil + max_workers
    ports:
      - "127.0.0.1:8050:8050"
    networks:
      - fide_net
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`scelo.chesspit.net`)"
      - "traefik.http.routers.orchestrator.entrypoints=https"
      - "traefik.http.routers.orchestrator.tls=true"
      - "traefik.http.routers.orchestrator.tls.certresolver=letsencrypt"
      - "traefik.http.routers.orchestrator.middlewares=orchestrator-auth"
      - "traefik.http.middlewares.orchestrator-auth.basicauth.users=peter:$$2a$$14$$AxmEncpsINswxyIJneTobunbJmseSDGwHJsi27DProe4P9e7TPfOy"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8050"
      - "traefik.docker.network=coolify"
    restart: unless-stopped

  worker:

    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    command: python -m orchestrator.worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://fide:${DB_PASSWORD}@host.docker.internal:5432/fidedb
      ORCHESTRATOR_DATA_DIR: /data
      PROXYJET_USERNAME: ${PROXYJET_USERNAME}
      PROXYJET_PASSWORD: ${PROXYJET_PASSWORD}
      PROXYJET_HOST: ${PROXYJET_HOST:-proxy-jet.io}
      PROXYJET_PORT: ${PROXYJET_PORT:-1010}
      PROXYJET_DC_USERNAME: ${PROXYJET_DC_USERNAME:-}
      PROXYJET_DC_IN_USERNAME:  ${PROXYJET_DC_IN_USERNAME:-}
      PROXYJET_DC_IN_PASSWORD:  ${PROXYJET_DC_IN_PASSWORD:-}
      PROXYJET_DC_UK_USERNAME:  ${PROXYJET_DC_UK_USERNAME:-}
      PROXYJET_DC_UK_PASSWORD:  ${PROXYJET_DC_UK_PASSWORD:-}
      PROXYJET_DC_US_USERNAME:  ${PROXYJET_DC_US_USERNAME:-}
      PROXYJET_DC_US_PASSWORD:  ${PROXYJET_DC_US_PASSWORD:-}
      PROXYJET_DC_HK_USERNAME:  ${PROXYJET_DC_HK_USERNAME:-}
      PROXYJET_DC_HK_PASSWORD:  ${PROXYJET_DC_HK_PASSWORD:-}
      PROXYJET_DC_ES_USERNAME:  ${PROXYJET_DC_ES_USERNAME:-}
      PROXYJET_DC_ES_PASSWORD:  ${PROXYJET_DC_ES_PASSWORD:-}
      PROXYJET_DC_MX_USERNAME:  ${PROXYJET_DC_MX_USERNAME:-}
      PROXYJET_DC_MX_PASSWORD:  ${PROXYJET_DC_MX_PASSWORD:-}
      PROXYJET_DC_AE_USERNAME:  ${PROXYJET_DC_AE_USERNAME:-}
      PROXYJET_DC_AE_PASSWORD:  ${PROXYJET_DC_AE_PASSWORD:-}
      PROXYJET_DC_DACH_USERNAME: ${PROXYJET_DC_DACH_USERNAME:-}
      PROXYJET_DC_DACH_PASSWORD: ${PROXYJET_DC_DACH_PASSWORD:-}
      PROXYJET_DC_UPDATE_USERNAME: ${PROXYJET_DC_UPDATE_USERNAME:-}
      PROXYJET_DC_UPDATE_PASSWORD: ${PROXYJET_DC_UPDATE_PASSWORD:-}
      WORKER_DEVICE: ${WORKER_DEVICE:-}
    volumes:
      - orchestrator_data:/data
      - ../config.yaml:/app/config.yaml:ro
      - ../data:/app/data:ro
      - ./profiles.yaml:/app/orchestrator/profiles.yaml:ro
    networks:
      - fide_net
    # unless-stopped — Worker immer neu starten (auch nach Crash), ausser bei explizitem
    # 'docker compose stop'. Worker selbst exitiert nicht mehr bei "stopped"-Command,
    # sondern wartet im Poll-Loop auf den Start-Befehl vom Dashboard.
    restart: unless-stopped

volumes:
  orchestrator_data:

networks:
  fide_net:
    external: true
    name: ${DOCKER_NETWORK:-fide-scraper_default}
  coolify:
    external: true
    name: coolify
