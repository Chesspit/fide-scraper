active_profile: normal

# Parallelität: wie viele Threads gleichzeitig je eine eigene Gruppe scrapen.
# max_workers: 1 = sequentiell (bisheriges Verhalten), 2–4 = parallel.
# worker_profiles: Profil je Thread-Slot (Index 0, 1, 2, 3).
# Erster Test: max_workers=2; auf 4 hochsetzen sobald stabil.
concurrency:
  # worker_slots: unabhängiges enabled-Flag + Profil pro Slot (ersetzt max_workers)
  worker_slots:
    - slot: 0
      enabled: true
      profile: semi_aggressive
    - slot: 1
      enabled: true
      profile: normal
    - slot: 2
      enabled: false
      profile: semi_conservative
    - slot: 3
      enabled: false
      profile: semi_aggressive
  # max_workers + worker_profiles: Backward-Compat (wird beim Start migriert)
  max_workers: 2
  worker_profiles:
    - semi_aggressive
    - normal
    - semi_conservative
    - semi_aggressive
  # Datacenter-Threads: je 1 pro Land, mit eigenem ProxyJet-Host + Credentials
  # enabled: false → Thread wird nicht gestartet (bis Proxy bestellt + .env eingetragen)
  # timezone + active_hours: Thread läuft nur innerhalb 7–23 Uhr Ortszeit
  # federations: diese Föderationen bekommen thread_affinity=<id> beim Gruppen-Generieren
  datacenter_threads:
    - id: dc_de
      enabled: true
      label: DC-DE
      slot: 99
      host: proxy-jet.io
      port: 1010
      username_env: PROXYJET_DC_USERNAME
      password_env: PROXYJET_PASSWORD
      timezone: Europe/Berlin
      active_hours: [7, 23]
      profile: semi_conservative
      federations: []
    - id: dc_in
      enabled: false
      label: DC-IN
      slot: 100
      host: in.proxy-jet.io
      port: 1010
      username_env: PROXYJET_DC_IN_USERNAME
      password_env: PROXYJET_DC_IN_PASSWORD
      timezone: Asia/Kolkata
      active_hours: [7, 23]
      profile: semi_conservative
      federations: [IND, PAK, BAN, SRI, NEP]
    - id: dc_uk
      enabled: false
      label: DC-UK
      slot: 101
      host: eu.proxy-jet.io
      port: 1010
      username_env: PROXYJET_DC_UK_USERNAME
      password_env: PROXYJET_DC_UK_PASSWORD
      timezone: Europe/London
      active_hours: [7, 23]
      profile: semi_conservative
      federations: [ENG, SCO, WLS, IRL, NIR, CYP, MLT, GIB]
    - id: dc_us
      enabled: false
      label: DC-US
      slot: 102
      host: ca.proxy-jet.io
      port: 1010
      username_env: PROXYJET_DC_US_USERNAME
      password_env: PROXYJET_DC_US_PASSWORD
      timezone: America/New_York
      active_hours: [7, 23]
      profile: semi_conservative
      federations: [USA, CAN, MEX, PUR, CUB, DOM, JAM, TTO, BER, BAH]
    - id: dc_hk
      enabled: false
      label: DC-HK
      slot: 103
      host: in.proxy-jet.io
      port: 1010
      username_env: PROXYJET_DC_HK_USERNAME
      password_env: PROXYJET_DC_HK_PASSWORD
      timezone: Asia/Hong_Kong
      active_hours: [7, 23]
      profile: semi_conservative
      federations: [HKG, CHN, SGP, MAS, PHI, TPE, VIE, THA, INA, MGL, KOR, JPN, AUS, NZL]

# Fuzzy-Profilauswahl: Gewichtung für zufällige Profilwahl pro Gruppe
# Worker wählt bei jedem Gruppen-Start zufällig (gewichtet) — kein erkennbares Muster
# aggressive + conservative: Gewicht 0 — nur zur Referenz, nicht mehr im Einsatz
fuzzy_weights:
  aggressive:        0
  semi_aggressive:  60
  normal:           40
  semi_conservative:  0
  conservative:      0
profiles:
  # --- Referenz-Profile (nicht mehr im Einsatz) ---
  aggressive:
    base_wait_seconds: 1.0
    min_wait_seconds: 0.7
    jitter: 0.30
    timeout_seconds: 10
    max_retries: 2
    cooldown_on_429: 30
    use_proxy: false
  conservative:
    base_wait_seconds: 8.0
    min_wait_seconds: 4.0
    jitter: 0.50
    timeout_seconds: 30
    max_retries: 5
    cooldown_on_429: 120
    use_proxy: true
  # --- Aktive Profile ---
  semi_aggressive:
    base_wait_seconds: 2.0
    min_wait_seconds: 1.1
    jitter: 0.35
    timeout_seconds: 15
    max_retries: 2
    cooldown_on_429: 45
    use_proxy: true
  normal:
    base_wait_seconds: 3.0
    min_wait_seconds: 1.5
    jitter: 0.40
    timeout_seconds: 20
    max_retries: 3
    cooldown_on_429: 60
    use_proxy: true
  semi_conservative:
    base_wait_seconds: 5.5
    min_wait_seconds: 2.7
    jitter: 0.45
    timeout_seconds: 25
    max_retries: 4
    cooldown_on_429: 90
    use_proxy: true
