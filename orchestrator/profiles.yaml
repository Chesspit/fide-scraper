active_profile: normal

# Parallelität: wie viele Threads gleichzeitig je eine eigene Gruppe scrapen.
# max_workers: 1 = sequentiell (bisheriges Verhalten), 2–4 = parallel.
# worker_profiles: Profil je Thread-Slot (Index 0, 1, 2, 3).
# Erster Test: max_workers=2; auf 4 hochsetzen sobald stabil.
concurrency:
  # worker_slots: unabhängiges enabled-Flag + Profil pro Slot (ersetzt max_workers)
  worker_slots:
    - slot: 0
      enabled: true
      profile: semi_aggressive
      max_hours: null
    - slot: 1
      enabled: true
      profile: normal
      max_hours: null
    - slot: 2
      enabled: false
      profile: semi_conservative
      max_hours: null
    - slot: 3
      enabled: false
      profile: semi_aggressive
      max_hours: null
  # max_workers + worker_profiles: Backward-Compat (wird beim Start migriert)
  max_workers: 2
  worker_profiles:
    - semi_aggressive
    - normal
    - semi_conservative
    - semi_aggressive
  # DC-Betriebsmodus:
  #   auto:        Threads laufen nur innerhalb dc_active_hours Ortszeit (Timezone je Thread)
  #   individual:  Timezone wird ignoriert — Threads laufen wenn enabled=true, rund um die Uhr
  dc_mode: auto
  dc_active_hours: [7, 23]   # Gilt für alle Threads im auto-Modus
  # Datacenter-Threads: je 1 pro Land, mit eigenem ProxyJet-Host + Credentials
  datacenter_threads:
    - id: dc_de
      enabled: true
      label: DC-DE
      slot: 99
      host: proxy-jet.io
      port: 1010
      username_env: PROXYJET_DC_USERNAME
      password_env: PROXYJET_PASSWORD
      timezone: Europe/Berlin
      active_hours: [7, 23]
      profile: semi_conservative
      max_hours: null
      federations: [POL, UKR, LAT, LIT, LTU, EST, CZE, SVK, FID]
    - id: dc_in
      enabled: false
      label: DC-IN
      slot: 100
      host: in.proxy-jet.io
      port: 1010
      username_env: PROXYJET_DC_IN_USERNAME
      password_env: PROXYJET_DC_IN_PASSWORD
      timezone: Asia/Kolkata
      active_hours: [7, 23]
      profile: semi_conservative
      max_hours: null
      federations: [IND, IRI]
    - id: dc_uk
      enabled: false
      label: DC-UK
      slot: 101
      host: eu.proxy-jet.io
      port: 1010
      username_env: PROXYJET_DC_UK_USERNAME
      password_env: PROXYJET_DC_UK_PASSWORD
      timezone: Europe/London
      active_hours: [7, 23]
      profile: semi_conservative
      max_hours: null
      federations: [ENG, SCO, WLS, IRL, NIR, DEN, NOR, SWE, FIN, ISL, NED, BEL, LUX]
    - id: dc_us
      enabled: false
      label: DC-US
      slot: 102
      host: ca.proxy-jet.io
      port: 1010
      username_env: PROXYJET_DC_US_USERNAME
      password_env: PROXYJET_DC_US_PASSWORD
      timezone: America/New_York
      active_hours: [7, 23]
      profile: semi_conservative
      max_hours: null
      federations: [USA, CAN, MEX]
    - id: dc_hk
      enabled: false
      label: DC-HK
      slot: 103
      host: in.proxy-jet.io
      port: 1010
      username_env: PROXYJET_DC_HK_USERNAME
      password_env: PROXYJET_DC_HK_PASSWORD
      timezone: Asia/Hong_Kong
      active_hours: [7, 23]
      profile: semi_conservative
      max_hours: null
      federations: [CHN, VIE, AUS, NZL, FIJ, VAN, PLW, SOL, KIR, PNG, MHL, TUV, NAU, SAM, TON, FSM]
    # ── Platzhalter für 3 weitere Datacenter-Scraper (noch nicht aktiv) ──────
